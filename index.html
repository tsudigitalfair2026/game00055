<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>わんわんシューティング</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
margin:0;height:100%;overflow:hidden;
font-family:sans-serif;background:#1b1f2a;color:#fff;
touch-action:none;
}
.screen{
display:none;height:100vh;padding:16px;
justify-content:center;align-items:center;
flex-direction:column;text-align:center;
}
.active{display:flex;}
button{
font-size:20px;font-weight:bold;
padding:16px 28px;border:none;border-radius:14px;
background:#ffb300;color:#000;min-width:200px;
}
#gameScreen{display:none;height:100vh;flex-direction:column;}
#hud{
display:flex;justify-content:space-between;
padding:10px;background:#111827;font-weight:bold;
}
#gameArea{
position:relative;flex:1;overflow:hidden;
background:linear-gradient(#63b8ff,#dff7ff);
touch-action:none;
}
#player{
position:absolute;
bottom:10px;
left:50%;
transform:translateX(-50%);
font-size:56px;
}
.enemy,.bullet,.boss{
position:absolute;
user-select:none;
}
.enemy{font-size:42px;}
.bullet{font-size:24px;}
.boss{
font-size:100px;
filter:drop-shadow(0 0 8px #f00);
}
.rank{font-size:42px;color:gold;font-weight:bold;}
#bossHpBar{
position:absolute;
top:8px;left:8px;
width:calc(100% - 16px);
height:16px;
background:#333;
display:none;
border-radius:8px;
overflow:hidden;
}
#bossHp{
height:100%;
width:100%;
background:#ff4040;
}
</style>
</head>
<body>

<div id="startScreen" class="screen active">
<h1>🐶 わんわんシューティング</h1>
<p>
犬をドラッグして移動！<br>
骨を発射してネコを倒そう。<br>
残り15秒になると巨大ネコボス出現！<br>
60秒後にスコアで評価！
</p>
<button id="startBtn">スタート</button>
</div>

<div id="gameScreen">
<div id="hud">
<div>スコア:<span id="score">0</span></div>
<div>残り:<span id="time">60</span>秒</div>
</div>

<div id="gameArea">
<div id="bossHpBar"><div id="bossHp"></div></div>
<div id="player">🐶</div>
</div>
</div>

<div id="resultScreen" class="screen">
<h1>結果発表</h1>
<div style="font-size:30px;">スコア: <span id="finalScore">0</span></div>
<div id="rank" class="rank">C</div>
<button id="restartBtn">もう一度遊ぶ</button>
</div>

<script>
const startScreen=document.getElementById("startScreen");
const gameScreen=document.getElementById("gameScreen");
const resultScreen=document.getElementById("resultScreen");
const gameArea=document.getElementById("gameArea");
const player=document.getElementById("player");
const scoreEl=document.getElementById("score");
const timeEl=document.getElementById("time");
const finalScore=document.getElementById("finalScore");
const rankEl=document.getElementById("rank");
const bossHpBar=document.getElementById("bossHpBar");
const bossHpEl=document.getElementById("bossHp");

let score,timeLeft,playerX;
let bullets=[],enemies=[];
let spawnTimer,timerLoop;
let running=false;
let boss=null,bossHP=0,bossSpawned=false;

function startGame(){
score=0;
timeLeft=60;
running=true;
boss=null;
bossHP=0;
bossSpawned=false;

scoreEl.textContent=0;
timeEl.textContent=60;
bossHpBar.style.display="none";

document.querySelectorAll(".enemy,.bullet,.boss").forEach(e=>e.remove());

bullets=[];
enemies=[];

startScreen.classList.remove("active");
resultScreen.classList.remove("active");
gameScreen.style.display="flex";

playerX=gameArea.clientWidth/2;
updatePlayer();

spawnTimer=setInterval(spawnEnemy,500);

timerLoop=setInterval(()=>{
timeLeft--;
timeEl.textContent=timeLeft;

if(timeLeft===15 && !bossSpawned){
spawnBoss();
}

if(timeLeft<=0){
endGame();
}
},1000);

requestAnimationFrame(loop);
}

function spawnEnemy(){
if(!running || bossSpawned) return;

const el=document.createElement("div");
el.className="enemy";
el.textContent=Math.random()<0.2?"😾":"🐱";

const x=Math.random()*(gameArea.clientWidth-50);
gameArea.appendChild(el);

enemies.push({
el,x,y:-50,
speed:4+Math.random()*4
});
}

function spawnBoss(){
bossSpawned=true;

const el=document.createElement("div");
el.className="boss";
el.textContent="😾";
gameArea.appendChild(el);

bossHP=50;

boss={
el,
x:gameArea.clientWidth/2-50,
y:40,
dir:4
};

bossHpBar.style.display="block";
updateBossHp();
}

function updateBossHp(){
bossHpEl.style.width=(bossHP*2)+"%";
}

function shoot(){
if(!running)return;

const el=document.createElement("div");
el.className="bullet";
el.textContent="🦴";
gameArea.appendChild(el);

bullets.push({
el,
x:playerX,
y:gameArea.clientHeight-90
});
}

function loop(){
if(!running)return;

for(let i=bullets.length-1;i>=0;i--){
const b=bullets[i];
b.y-=11;
b.el.style.left=b.x+"px";
b.el.style.top=b.y+"px";

if(b.y<-30){
b.el.remove();
bullets.splice(i,1);
}
}

for(let i=enemies.length-1;i>=0;i--){
const e=enemies[i];
e.y+=e.speed;
e.el.style.left=e.x+"px";
e.el.style.top=e.y+"px";

if(e.y>gameArea.clientHeight){
e.el.remove();
enemies.splice(i,1);
score=Math.max(0,score-5);
scoreEl.textContent=score;
continue;
}

	for(let j=bullets.length-1;j>=0;j--){
		const b=bullets[j];
		if(Math.abs(b.x-e.x)<35 && Math.abs(b.y-e.y)<35){
			b.el.remove();
			e.el.remove();
			bullets.splice(j,1);
			enemies.splice(i,1);
			score+=10;
			scoreEl.textContent=score;
			break;
		}
	}
}

if(boss){
boss.x+=boss.dir;
if(boss.x<0 || boss.x>gameArea.clientWidth-100){
boss.dir*=-1;
}
boss.el.style.left=boss.x+"px";
boss.el.style.top=boss.y+"px";

for(let j=bullets.length-1;j>=0;j--){
const b=bullets[j];

if(
b.x>boss.x &&
b.x<boss.x+100 &&
b.y>boss.y &&
b.y<boss.y+100
){
b.el.remove();
bullets.splice(j,1);
bossHP--;
updateBossHp();

if(bossHP<=0){
score+=200;
scoreEl.textContent=score;
boss.el.remove();
boss=null;
bossHpBar.style.display="none";
}
}
}
}

requestAnimationFrame(loop);
}

function endGame(){
running=false;
clearInterval(spawnTimer);
clearInterval(timerLoop);

gameScreen.style.display="none";
resultScreen.classList.add("active");

finalScore.textContent=score;

let rank="C";
if(score>=350)rank="S";
else if(score>=250)rank="A";
else if(score>=150)rank="B";

rankEl.textContent=rank;
}

function updatePlayer(){
playerX=Math.max(30,Math.min(gameArea.clientWidth-30,playerX));
player.style.left=playerX+"px";
}

let dragging=false;
let autoFire=null;

function move(e){
const r=gameArea.getBoundingClientRect();
playerX=e.clientX-r.left;
updatePlayer();
}

gameArea.addEventListener("pointerdown",e=>{
dragging=true;
move(e);
shoot();
clearInterval(autoFire);
autoFire=setInterval(shoot,180);
});

gameArea.addEventListener("pointermove",e=>{
if(dragging)move(e);
});

window.addEventListener("pointerup",()=>{
dragging=false;
clearInterval(autoFire);
});

startBtn.onclick=startGame;
restartBtn.onclick=startGame;
</script>

</body>
</html>
